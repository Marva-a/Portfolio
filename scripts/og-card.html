<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        overflow: hidden;
        background: #fff7e8;
        font-family: "DM Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.75;
      }
      .yellow { background: #ffe9a8; width: 620px; height: 620px; top: -240px; left: -160px; }
      .purple { background: #d8c9ff; width: 640px; height: 640px; top: -220px; right: -180px; }
      .teal   { background: #b6ecdd; width: 600px; height: 600px; bottom: -300px; left: 34%; }
      .peach  { background: #ffd0c2; width: 460px; height: 460px; bottom: -220px; right: -80px; }

      .frame {
        position: relative;
        height: 100%;
        padding: 78px 84px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .eyebrow {
        font-size: 21px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #4d476a;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 700;
        font-size: 84px;
        line-height: 1.08;
        color: #1c1833;
        max-width: 960px;
      }
      .grad {
        font-style: italic;
        background-image: linear-gradient(90deg, #69debe 18%, #7cd2f2 40%, #8f74ff 62%, #ff806e 84%);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
      .name {
        display: inline-flex;
        align-items: center;
        height: 62px;
        padding: 0 28px;
        border-radius: 999px;
        background: #fffdf7;
        color: #1c1833;
        font-size: 22px;
        font-weight: 600;
        box-shadow: 0 8px 30px rgba(28, 24, 51, 0.1);
      }
      .pills { display: flex; gap: 12px; }
      .pill {
        padding: 12px 22px;
        border-radius: 999px;
        font-size: 19px;
        font-weight: 500;
        color: #1c1833;
      }
    </style>
  </head>
  <body>
    <div class="blob yellow"></div>
    <div class="blob purple"></div>
    <div class="blob teal"></div>
    <div class="blob peach"></div>

    <div class="frame">
      <div class="row">
        <span class="name">Marva Abouei</span>
        <span class="eyebrow">Lead Product Designer</span>
      </div>

      <h1>
        Turning <span class="grad">ambiguity</span><br />
        into clear product direction.
      </h1>

      <div class="pills">
        <span class="pill" style="background: #e8fff6">0-to-1</span>
        <span class="pill" style="background: #e6f6ff">Systems thinking</span>
        <span class="pill" style="background: #f0e9ff">B2B2C</span>
        <span class="pill" style="background: #ffe1d6">SaaS</span>
      </div>
    </div>
  </body>
</html>
