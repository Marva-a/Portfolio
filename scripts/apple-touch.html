<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* iOS composites a home-screen icon onto black wherever it is
         transparent, and applies its own rounded mask on top. So the icon
         has to be fully opaque and square — the mesh mark's own rounded
         corners are filled in with the same cream here, and iOS rounds it. */
      * { margin: 0; }
      html, body { width: 180px; height: 180px; overflow: hidden; }
      body { background: #fff7e8; }
      svg { display: block; width: 180px; height: 180px; }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
      <defs>
        <clipPath id="c"><path d="M34 7c12-1 22 8 23 20 1 12-6 15-9 22-3 7-14 10-24 6C13 51 6 42 6 31 6 20 20 8 34 7z"></path></clipPath>
        <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"></feGaussianBlur></filter>
      </defs>
      <rect width="64" height="64" fill="#FFF7E8"></rect>
      <g clip-path="url(#c)" filter="url(#b)">
        <circle cx="14" cy="16" r="20" fill="#69DEBE"></circle>
        <circle cx="52" cy="16" r="18" fill="#8F74FF" opacity="0.9"></circle>
        <circle cx="44" cy="54" r="22" fill="#FF806E" opacity="0.95"></circle>
        <circle cx="10" cy="50" r="16" fill="#7CD2F2" opacity="0.85"></circle>
      </g>
    </svg>
  </body>
</html>
