<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-ink.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-ink-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-ink-16.png" />
    <link
      rel="icon"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
      href="/favicon-mesh.svg"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Design System — Marva Abouei</title>
    <meta
      name="description"
      content="Internal reference for the tokens and components behind marva.design — not part of the public site."
    />
    <!-- Reachable only by direct URL (see DESIGN_SYSTEM.md) — kept out of
         search results and off the public nav until it's ready to link. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Same scheme-aware favicon swap as index.html — see that file for
         why both a media query and a script are needed. -->
    <script>
      (function () {
        var dark = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          var mark = dark.matches ? "mesh" : "ink";
          document
            .querySelectorAll('link[rel="icon"]:not([media])')
            .forEach(function (link) {
              var next = link.href.replace(
                /favicon-(ink|mesh)/,
                "favicon-" + mark,
              );
              if (next !== link.href) link.href = next;
            });
        }
        apply();
        dark.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/design-system/main.jsx"></script>
  </body>
</html>
