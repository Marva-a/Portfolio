<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Two crops of the same mark, not one file scaled: the tab sizes are
         cropped tight so the "m" fills the frame, while the home-screen
         sizes keep the blob whole with room around it. Href paths are
         root-relative and Vite rewrites them against `base` at build. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Marva Abouei — Lead Product Designer</title>
    <meta
      name="description"
      content="Marva Abouei is a Lead Product Designer in Vancouver working on 0-to-1 and AI products — turning ambiguous problems into clear product direction through strategy, research and systems thinking."
    />
    <link rel="canonical" href="https://marva.design/" />

    <!-- Open Graph / LinkedIn, Slack, iMessage. Absolute URLs are required:
         crawlers don't resolve relative paths against the page. og-image.png
         is regenerated from scripts/og-card.html — see scripts/README.md. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marva Abouei" />
    <meta property="og:url" content="https://marva.design/" />
    <meta
      property="og:title"
      content="Marva Abouei — Lead Product Designer"
    />
    <meta
      property="og:description"
      content="Turning ambiguity into clear product direction. 0-to-1, AI and spatial products — strategy, research and systems thinking."
    />
    <meta property="og:image" content="https://marva.design/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Turning ambiguity into clear product direction — Marva Abouei, Lead Product Designer"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Marva Abouei — Lead Product Designer"
    />
    <meta
      name="twitter:description"
      content="Turning ambiguity into clear product direction. 0-to-1, AI and spatial products — strategy, research and systems thinking."
    />
    <meta name="twitter:image" content="https://marva.design/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
