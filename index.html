<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Two marks, picked by the browser's colour scheme: "ink" is the dark
         blob, which is the one a LIGHT tab bar needs, and "mesh" is the pale
         blob on cream for a DARK one. The links below default to ink; the
         script further down swaps them when the scheme is dark. Href paths
         are root-relative and Vite rewrites them against `base` at build.

         Both a media attribute and a script: Firefox honours `media` on an
         icon link, Chromium and Safari largely don't, and the script covers
         every engine plus a scheme change while the tab is already open. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-ink.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-ink-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-ink-16.png" />
    <link
      rel="icon"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
      href="/favicon-mesh.svg"
    />
    <!-- Opaque and square: iOS paints a home-screen icon's transparent
         pixels black and applies its own rounded mask, so this one is the
         mesh mark flattened onto cream (see scripts/apple-touch.html). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Marva Abouei — Lead Product Designer</title>
    <meta
      name="description"
      content="Marva Abouei is a Lead Product Designer in Vancouver working on 0-to-1 and AI products — turning ambiguous problems into clear product direction through strategy, research and systems thinking."
    />
    <link rel="canonical" href="https://marva.design/" />

    <!-- Open Graph / LinkedIn, Slack, iMessage. Absolute URLs are required:
         crawlers don't resolve relative paths against the page. og-image.png
         is regenerated from scripts/og-card.html — see scripts/README.md. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marva Abouei" />
    <meta property="og:url" content="https://marva.design/" />
    <meta
      property="og:title"
      content="Marva Abouei — Lead Product Designer"
    />
    <meta
      property="og:description"
      content="Turning ambiguity into clear product direction. 0-to-1, AI and spatial products — strategy, research and systems thinking."
    />
    <meta property="og:image" content="https://marva.design/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Turning ambiguity into clear product direction — Marva Abouei, Lead Product Designer"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Marva Abouei — Lead Product Designer"
    />
    <meta
      name="twitter:description"
      content="Turning ambiguity into clear product direction. 0-to-1, AI and spatial products — strategy, research and systems thinking."
    />
    <meta name="twitter:image" content="https://marva.design/og-image.png" />

    <!-- Swaps every icon link between the ink and mesh marks. Rewrites only
         the filename inside the resolved URL, so it stays correct whatever
         `base` the site is built with. Runs in <head> before first paint,
         and again whenever the OS scheme changes with the tab open. -->
    <script>
      (function () {
        var dark = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          var mark = dark.matches ? "mesh" : "ink";
          document
            .querySelectorAll('link[rel="icon"]:not([media])')
            .forEach(function (link) {
              var next = link.href.replace(
                /favicon-(ink|mesh)/,
                "favicon-" + mark,
              );
              // Reassigning an unchanged href still makes some browsers
              // refetch the icon, which flickers the tab.
              if (next !== link.href) link.href = next;
            });
        }
        apply();
        dark.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
